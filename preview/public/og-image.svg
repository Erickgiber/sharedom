<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="60%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Accent Linear Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Logo Linear Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Grid Dots Pattern -->
  <pattern id="dotPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dotPattern)" />

  <!-- Ambient Glow Circles -->
  <circle cx="220" cy="180" r="260" fill="#7c3aed" opacity="0.15" filter="blur(80px)" />
  <circle cx="980" cy="420" r="280" fill="#ec4899" opacity="0.1" filter="blur(90px)" />

  <!-- Container Box -->
  <g transform="translate(100, 110)">
    <!-- Logo Badge -->
    <g transform="translate(0, 0)">
      <rect width="84" height="84" rx="22" fill="url(#logoBg)" />
      <rect x="1" y="1" width="82" height="82" rx="21" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none" />
      <path d="M21 31.5V24.5H28" stroke="white" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M63 31.5V24.5H56" stroke="white" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M21 52.5V59.5H28" stroke="white" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M63 52.5V59.5H56" stroke="white" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M33.2 38.5L28 42.8L33.2 47.2" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M50.8 38.5L56 42.8L50.8 47.2" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="42" cy="42.8" r="5.2" fill="white" />
      <circle cx="59.5" cy="24.5" r="2.6" fill="#facc15" />
    </g>

    <!-- Header Brand Name -->
    <text x="105" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">ShareDOM</text>
    
    <!-- Version Pill -->
    <rect x="330" y="24" width="76" height="32" rx="16" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.4)" stroke-width="1" />
    <text x="368" y="45" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" text-anchor="middle">v1.0.1</text>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="'Fraunces', Georgia, serif" font-size="64" font-weight="700" letter-spacing="-0.03em">
      Screenshot <tspan fill="url(#purpleGrad)" font-style="italic">anything</tspan>
    </text>
    <text x="0" y="235" fill="#ffffff" font-family="'Fraunces', Georgia, serif" font-size="64" font-weight="700" letter-spacing="-0.03em">
      in the browser &amp; server.
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Zero-dependency library for pixel-perfect DOM snapshots &amp; high-DPI SSR captures.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 340)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="80" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚡ &lt; 4 kB Gzipped</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="190" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="270" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🌐 Next.js &amp; SvelteKit</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="175" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="467" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🔍 Retina 2x &amp; 3x</text>

      <!-- Pill 4 -->
      <rect x="570" y="0" width="170" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="655" y="26" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🛡️ 100% TypeScript</text>
    </g>

    <!-- NPM Command Pill -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="280" height="46" rx="10" fill="rgba(0,0,0,0.6)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5" />
      <text x="20" y="28" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600">$</text>
      <text x="40" y="28" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600">npm i sharedom</text>
    </g>
  </g>
</svg>
